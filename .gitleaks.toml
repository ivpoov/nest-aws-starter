title = "nest-aws-starter"

# Secret-scanning configuration, consumed by the `secret-scan` job in
# .github/workflows/security.yml and by anyone running `gitleaks` locally.
#
# The gate scans the FULL commit history, not the working tree: this repository
# is published with its history intact, so a credential deleted at HEAD is
# still readable in the commit that introduced it. `fetch-depth: 0` in the
# workflow is load-bearing for the same reason — a shallow clone would scan
# only the tip and report a clean bill of health for a repo full of leaks.
#
# ALLOWLIST POLICY: every entry below is a verified false positive with its
# reasoning written out. An allowlist is never the remedy for a real
# credential — that requires rotating the secret and rewriting history. If you
# add an entry, say what the matched string actually is and why it is inert.

[extend]
useDefault = true

[[allowlists]]
description = """
CloudFront signer unit test. The matched text is a PEM header/footer wrapped
around the literal three-character string 'abc'; the test asserts only that the
config loader passes the value through verbatim and that the signer rejects it,
so there is no key material here. Scoped to the one spec file and to the exact
'abc' body, so a genuine key pasted into the same file would still be caught.
"""
targetRules = ["private-key"]
condition = "AND"
paths = [
  '''apps/api/src/modules/common/providers/cloudfront/tests/cloudfront-signer\.service\.spec\.ts''',
]
regexes = [
  '''-----BEGIN PRIVATE KEY-----\\{1,2}nabc\\{1,2}n-----END PRIVATE KEY-----''',
]

[[allowlists]]
description = """
User e2e fixture. 'argon2-placeholder' is a human-readable stand-in written
into the `passwordHash` column of a seeded test user. It is not an Argon2 hash,
it is not derived from any password, and no code path ever verifies against it.
Scoped to the one spec file and to that exact literal.
"""
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''apps/api/test/user\.e2e-spec\.ts''']
regexes = ['''^argon2-placeholder$''']

[[allowlists]]
description = """
Entropy-checker unit fixtures. The production boot guard scores AUTH_JWT_SECRET
for entropy, so its spec must assert exact bit counts against known inputs —
which means synthetic `openssl rand -hex`-shaped literals, hardcoded rather
than generated so the assertions stay deterministic. They are test inputs to a
scoring function; nothing signs or verifies with them, and they were never a
credential anywhere. Scoped to the one spec file and to bare 64/96-character
hex, so a real AWS key, GitHub PAT or private key pasted into the same file
would still be caught.
"""
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''apps/api/src/modules/common/helpers/tests/(collect-production-violations|assert-production-config)\.helper\.spec\.ts''',
]
regexes = ['''^[0-9a-f]{64}$|^[0-9a-f]{96}$''']

[[allowlists]]
description = """
Token-allowlist repository unit fixtures. The three matched strings are
hand-written JWT-shaped literals, all sharing the header `{"alg":"HS256"}` and
the payload `{"sub":"user-1","sessionId":"sess-1"}`, and differing only in a
signature segment of twenty repeated `a`, `b` or `c` characters. Nothing signed
them and nothing verifies them: the spec feeds them to TokenRedisRepository to
prove the stored value is a SHA-256 digest and NOT the token, so the literal
has to look like a real token for the assertion to mean anything. They are
values a test compares against, never credentials — no secret, no environment,
no account.

Both rules are listed because both fire on the same three lines: `jwt` on the
token shape itself, `generic-api-key` on the `const NAME = '<value>'`
assignment around it.

Scoped to the one spec file AND to the exact three literals, enumerated rather
than pattern-matched, so anything else in this file is still scanned normally.
Verified by injecting five credentials into this very file and re-running the
gate: `AKIA4KTZQ7NR2WVMJX3D` (aws-access-token), a 40-character AWS secret
(generic-api-key), `ghp_…` (github-pat), a 64-character hex secret
(generic-api-key), and a fourth JWT-shaped fixture whose signature segment is
not one of the three enumerated here (jwt). All five were reported. Note when
repeating that test: gitleaks' bundled config allowlists anything containing
`EXAMPLE`, so the canonical `AKIAIOSFODNN7EXAMPLE` pair proves nothing — use a
key that is merely realistic.
"""
targetRules = ["jwt", "generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = [
  '''apps/api/src/modules/token/tests/token-redis\.repository\.spec\.ts''',
]
regexes = [
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJ1c2VyLTEiLCJzZXNzaW9uSWQiOiJzZXNzLTEifQ\.(a{20}|b{20}|c{20})$''',
]

[[allowlists]]
description = """
Terraform map keys literally named `key`. The generic-api-key rule fires on the
assignment shape, not on the value: `key = "actual-50"` in the budget module is
a notification identifier used to index a for_each map, and the equivalents in
other modules name resources rather than authenticate to them. Scoped to
infra/terraform AND to the exact shapes these keys take — `actual-<n>`,
`forecasted-<n>`, an interpolation, and the state-file path. Enumerated rather
than pattern-matched on purpose: a loose `[a-z0-9-]+` would have suppressed a
64-character lowercase hex secret pasted into a .tf file, which is precisely
what this gate exists to catch. A new key shape trips the gate and forces a
conscious decision instead of sliding through. Secrets in this stack are SSM SecureStrings generated by
random_password and are never written as literals.
"""
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
paths = ['''infra/terraform/.*\.tf''']
regexes = [
  '''^(actual|forecasted)-([0-9]{1,3}|\$\{[a-z_.]+\})$''',
  '''^<environment>/terraform\.tfstate$''',
]
