name: ci

# Every `uses:` here is pinned to a commit SHA, with the human-readable
# version in the trailing comment. A tag — even `@v7` from a publisher as
# reputable as GitHub's own actions org — is a mutable pointer: whoever can
# push to the repository can move it onto different code, and every workflow
# that trusts the tag runs that code on the next build, with this repository's
# token in scope. The SHA is the only reference that cannot be repointed.
#
# Publisher reputation is not the control here, so first-party `actions/*` are
# pinned on exactly the same terms as everything else.
#
# To upgrade: read the upstream release notes, take the SHA the new tag points
# at from the GitHub API (not from a mirror), and update the SHA and the
# comment together — a comment that disagrees with its SHA is worse than no
# comment, because review stops reading the SHA.

on:
  # Every branch on the promotion path — feature → dev → staging → main — not
  # main alone. A pull request check tests a SIMULATED merge of head into base;
  # the merge commit that actually lands is a different commit and, until this
  # covered dev and staging, was never built anywhere. Only main got that
  # confirmation, so a promotion could put something on staging that no run had
  # ever seen.
  push:
    branches: [dev, staging, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declared rather than inherited. A repository's default workflow permissions
# are a settings toggle, and the permissive setting ("read and write") is still
# the default on older organisations — which would hand every job here a token
# that can push to the repository, for jobs that only ever read it. Stating the
# scope in the file makes it a property of the workflow instead of a property of
# whoever last touched Settings -> Actions.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      # Migrate BEFORE build: `prisma generate --sql` (inside `pnpm run build`)
      # type-checks TypedSQL queries against the real schema, not just a
      # reachable port — a fresh runner's Postgres is empty until this runs.
      - run: pnpm --dir apps/api run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      # turbo fans out: api tsc+swc, web/admin tsc + vite build, shared tsc.
      # DATABASE_URL is required here too: `prisma generate --sql` type-checks
      # TypedSQL queries against a live database, not just the schema.
      - run: pnpm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      # turbo fans out: api + web + admin vitest suites. `test` depends on
      # `build` in turbo.json, and DATABASE_URL is in that task's env
      # allowlist — so it's part of the build cache signature. Without it
      # here, turbo sees a different signature than the dedicated build step
      # above, misses cache, and re-runs the api build (prisma generate
      # --sql) with no DB access.
      - run: pnpm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      # Coverage is measured over BOTH suites, not just the unit one. Each run
      # writes a blob report and `test:cov` merges them, so the gate sees what
      # the tests actually reach. Measured unit-only the figures are 75.11%
      # statements and 67.49% functions; measured across both they are 96.03%
      # and 98.03% — the difference is entirely the e2e specs, which drive the
      # app over real HTTP and contribute nothing to a unit-only report. The
      # old gate did worse than under-report: it aimed effort at files that
      # were already covered.
      #
      # This re-runs the api unit specs that `pnpm run test` just ran, which
      # costs about fifteen seconds and is what keeps `pnpm test` fast for a
      # developer who wants a plain suite without coverage instrumentation.
      - run: pnpm --dir apps/api run test:blob
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      # `pnpm run build` type-checks src only (tsconfig.build.json excludes
      # test/), and vitest never type-checks — so without this a spec could
      # import a symbol that no longer exists and only fail at runtime.
      #
      # The default tsconfig.json, NOT tsconfig.e2e.json: the e2e config
      # excludes `**/*.spec.ts`, which left every unit spec unchecked by
      # anything, anywhere. That exclusion had accumulated 12 type errors —
      # mocks missing interface methods, fixtures missing fields — none of
      # which any suite could report, because a green vitest run says nothing
      # about types. tsconfig.json includes src and test with no exclusions,
      # so it subsumes the e2e pass rather than sitting beside it.
      #
      # tsconfig.e2e.json still exists for scripts/subtraction-test.mjs, which
      # type-checks each subtracted tree without the unit specs.
      - run: pnpm --dir apps/api run typecheck
      - run: pnpm --dir apps/api run test:e2e:blob
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
          AWS_REGION: us-east-1
          S3_ENABLED: "true"
          S3_ENDPOINT: http://localhost:9010
          S3_BUCKET_NAME: starter
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          AWS_ENDPOINT_URL: http://localhost:4567
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          SQS_ENABLED: "true"
          SQS_PAYMENT_WEBHOOK_QUEUE_URL: http://localhost:4567/000000000000/starter-payment-webhook-queue
          SNS_ENABLED: "true"
          MAIL_ENABLED: "true"
          MAIL_FROM_ADDRESS: no-reply@example.com
          LAMBDA_ENABLED: "true"
          SCHEDULER_ENABLED: "false"
          PAYMENT_WEBHOOK_CONSUMER_ENABLED: "false"
          AUTH_JWT_SECRET: ci-only-secret-with-at-least-32-characters
          TRUST_PROXY: "true"
          WEBSOCKET_ENABLED: "true"
          WEBSOCKET_HEARTBEAT_INTERVAL_MS: "200"
      # Merges the two blob reports and applies the threshold. Last, so a real
      # test failure is reported as a test failure rather than as a coverage
      # shortfall.
      - run: pnpm --dir apps/api run test:cov

  # The same e2e suite against Redis Cluster instead of a single instance.
  #
  # WHY A SECOND FULL RUN AND NOT A FLAG ON THE FIRST: cluster mode is not a
  # configuration detail the code can be trusted to abstract over, and this
  # repository has the scars to prove it. Four bugs were found the first time
  # anyone ran the suite this way, and two of them were invisible in every
  # single-instance run there had ever been — pub/sub fan-outs silently
  # scanning zero nodes under `lazyConnect`, and `new Cluster([url])` dropping
  # TLS and credentials for discovered nodes while Terraform hands production a
  # `rediss://` URL. Both would have failed in production and nowhere else.
  #
  # Until this job existed, the only thing standing between those and a
  # deployment was somebody choosing to run it by hand. It is a separate job
  # rather than a second step so it runs in parallel with `test` and costs
  # wall-clock nothing.
  #
  # Cluster has no logical databases — only index 0 exists — so the suite's
  # usual trick of isolating onto database 1 does not apply here; the helpers
  # detect the cluster URL and skip it (test/helpers/e2e-redis-url.helper.ts).
  test-redis-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      # The four cluster nodes use `network_mode: host`, so they are reachable
      # on 127.0.0.1:7000-7003. `--wait` is not used here: redis-cluster-init
      # is a one-shot that forms the cluster and exits, and `--wait` treats a
      # completed one-shot as a failure.
      - run: docker compose --profile cluster up -d
      - name: wait for the cluster to finish forming
        run: |
          set -euo pipefail

          # `cluster_state:ok` is the only signal that means the slots are
          # assigned. A node answering PING says nothing: it answers before it
          # has joined, which is exactly the window a fixed sleep lands in.
          for attempt in $(seq 1 30); do
            state="$(docker run --rm --network host redis:8 redis-cli -p 7000 cluster info 2>/dev/null | tr -d '\r' | awk -F: '/^cluster_state:/ {print $2}')"
            if [ "${state:-}" = "ok" ]; then
              echo "cluster formed after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done

          echo "cluster never reached cluster_state:ok" >&2
          docker run --rm --network host redis:8 redis-cli -p 7000 cluster info >&2 || true
          exit 1
      - run: pnpm --dir apps/api run db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      - run: pnpm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
      - run: pnpm run test:e2e
        env:
          # The two variables this whole job exists for.
          REDIS_IS_CLUSTER: "true"
          REDIS_URL: redis://127.0.0.1:7000
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/starter?connection_limit=10"
          AWS_REGION: us-east-1
          S3_ENABLED: "true"
          S3_ENDPOINT: http://localhost:9010
          S3_BUCKET_NAME: starter
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          AWS_ENDPOINT_URL: http://localhost:4567
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          SQS_ENABLED: "true"
          SQS_PAYMENT_WEBHOOK_QUEUE_URL: http://localhost:4567/000000000000/starter-payment-webhook-queue
          SNS_ENABLED: "true"
          MAIL_ENABLED: "true"
          MAIL_FROM_ADDRESS: no-reply@example.com
          LAMBDA_ENABLED: "true"
          SCHEDULER_ENABLED: "false"
          PAYMENT_WEBHOOK_CONSUMER_ENABLED: "false"
          AUTH_JWT_SECRET: ci-only-secret-with-at-least-32-characters
          TRUST_PROXY: "true"
          WEBSOCKET_ENABLED: "true"
          WEBSOCKET_HEARTBEAT_INTERVAL_MS: "200"

  # The README's headline "make it yours" command, on a pristine clone —
  # exactly what a newcomer runs first. It went unnoticed that a tracked
  # symlink added with the docs workspace crashed it (EISDIR) before it wrote
  # anything, because nothing in CI had ever executed this script. --dry-run
  # writes nothing, so this is safe to run on every pull request; the working
  # tree is checked afterwards to prove it.
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/bootstrap.mjs --name smoke-app --scope @smoke-app --author "CI Smoke" --repo smoke/smoke-app --dry-run
      - name: assert --dry-run wrote nothing
        run: git diff --exit-code

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm audit --prod --audit-level high
      # A licence is not an advisory: no scanner was ever going to report
      # that a dependency relicensed to AGPL-3.0 under us, and the cost of
      # missing one lands on everybody who deploys a fork. `pnpm licenses`
      # reads package.json off disk, so this needs a real install — hence
      # the setup-node + install above, which `pnpm audit` alone did not.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run license-check
