name: infra

# Terraform's own gate: formatting, validity and lint, for both stacks and both
# cost profiles. It runs no `plan` and no `apply`, and it needs no AWS
# credentials — `init -backend=false` skips the S3 backend entirely, and
# `validate` resolves types, references and provider schemas without ever
# calling AWS. There is deliberately no OIDC role in this workflow: a check that
# runs on every pull request, including one from a fork, is the last place to
# hand out a credential.
#
# Why both profiles are linted separately: this stack has exactly one input that
# reshapes it, `cost_profile`, and everything downstream reads
# `local.profile.<key>`. A key added to one profile map and forgotten in the
# other is invisible to `validate`, which never evaluates those maps against a
# variable — it surfaces as a missing-attribute error for whoever happens to
# apply the other profile. Linting under each value is what makes that a red
# build instead of an apply-time surprise.
#
# Every `uses:` is pinned to a commit SHA with the human-readable version in the
# trailing comment, on the same terms as ci.yml — a tag is a mutable pointer,
# and a SHA is the only reference that cannot be repointed. To upgrade: read the
# upstream release notes, take the SHA the new tag points at from the GitHub
# API, and update the SHA and its comment together.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches `required_version = "~> 1.15"` in both stacks' versions.tf. Pinned
  # rather than "latest" so a Terraform release cannot turn a green build red
  # overnight, and so the version CI validates against is the one the README
  # tells a contributor to install.
  TERRAFORM_VERSION: 1.15.8
  TFLINT_VERSION: v0.63.1

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # terraform_wrapper: false — the action's default wraps the binary in a
      # script that captures stdout and stderr to populate step outputs, which
      # swallows the diff `fmt -check` prints and muddies exit codes. Nothing
      # here consumes those outputs.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # -recursive covers the root stack, bootstrap, and every module under
      # modules/ in one pass. -diff prints what it would have changed, so a
      # failure is actionable from the log without re-running anything locally.
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/terraform

      # -backend=false is what keeps this credential-free: it installs the
      # providers recorded in the committed .terraform.lock.hcl without
      # configuring or contacting the S3 backend. No -upgrade, so the pinned
      # versions and checksums in that lock file are exactly what runs — an init
      # that silently upgraded a provider would be validating something no
      # developer has on their machine.
      - name: terraform init (root)
        run: terraform -chdir=infra/terraform init -backend=false -input=false

      - name: terraform validate (root)
        run: terraform -chdir=infra/terraform validate

      # The bootstrap stack keeps its state on local disk and declares no
      # backend, so it needs the same treatment only for its providers.
      - name: terraform init (bootstrap)
        run: terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false

      - name: terraform validate (bootstrap)
        run: terraform -chdir=infra/terraform/bootstrap validate

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      # --recursive descends into every module directory and lints each as its
      # own root module. It runs without --var on purpose: cost_profile is
      # declared only in the root stack, and passing it here fails inside every
      # module, which by design cannot see it.
      - name: tflint (all modules)
        run: tflint --chdir=infra/terraform --recursive --no-color

      # Then the root stack once per profile — the pair that catches a key added
      # to one profile map and forgotten in the other.
      - name: tflint (demo profile)
        run: tflint --chdir=infra/terraform --var 'cost_profile=demo' --no-color

      - name: tflint (production profile)
        run: tflint --chdir=infra/terraform --var 'cost_profile=production' --no-color
