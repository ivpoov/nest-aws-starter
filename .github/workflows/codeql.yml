name: codeql

# Static analysis of the JavaScript/TypeScript in this repository.
#
# WHY `push` IS HERE. Code scanning alerts only reach the Security tab from
# analyses of a PUSH to the default branch. Pull-request runs gate the pull
# request and are then discarded; without a push trigger CodeQL computes its
# findings and throws them away, and the Security tab stays empty no matter
# what it saw. GitHub says so itself, as a warning annotation on every run:
# "Please specify an on.push hook to analyze and see code scanning alerts from
# the default branch on the Security tab."
#
# `main` is here alongside the default branch because that is the released
# tree, and an alert against what is tagged is worth more than one against what
# is merely merged.
#
# This job used to skip `push` deliberately, on the grounds that it is the most
# expensive gate here and cannot reuse the pnpm cache. That was written while
# the repository was private and Actions minutes were metered against a monthly
# allowance — the allowance ran out mid-release once. Public repositories are
# not metered, so the cost that argument rested on no longer exists.
#
# The weekly sweep stays: CodeQL's query packs improve over time, so yesterday's
# clean analysis is not a permanent answer for code that has not changed.
#
# The `paths` filter keeps docs-only and config-only runs from paying for an
# analysis that has nothing to analyse. If this workflow is ever added to
# branch protection as a required check, drop the filter first — a required
# check that is skipped by a path filter leaves pull requests waiting forever.
on:
  push:
    branches: [dev, staging, main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Uploading CodeQL results needs GitHub Code Security, which on a personal
    # Free/Pro account exists only while the repository is public — on a private
    # one the analyze step fails with a 403. This repository is public, so the
    # condition is satisfied; it stays because a private fork would otherwise
    # inherit a job that reddens every pull request for a reason nobody in that
    # fork can fix. Private: skips cleanly. Public: analyses by itself.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish the SARIF results to the Security tab.
      security-events: write
      # Lets CodeQL read workflow run metadata on private repositories.
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # build-mode: none — JavaScript/TypeScript is analysed straight from
      # source, so there is no `pnpm install` and no build step to pay for.
      # Adding one would only slow the job down without widening coverage.
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:javascript-typescript
