name: codeql

# Static analysis of the JavaScript/TypeScript in this repository.
#
# BUDGET: this is the most expensive gate here — a few minutes per run, and it
# cannot reuse the pnpm cache — so it is deliberately NOT wired to `push`.
# Pull requests plus one weekly sweep is the whole trigger set; the weekly run
# exists because CodeQL's query packs improve over time, so yesterday's clean
# analysis is not a permanent answer for code that has not changed.
#
# VISIBILITY: uploading CodeQL results needs GitHub Code Security, which on a
# personal Free/Pro account is available only while the repository is PUBLIC.
# This repository is still private, and on a private repository the analyze
# step fails with a 403 — which would paint every pull request red for a
# reason nobody can fix from here. So the job is gated on the repository being
# public: while private it skips cleanly, and the day visibility flips it
# starts analysing by itself. There is nothing to remember to switch on.
#
# The `paths` filter keeps docs-only and config-only pull requests from paying
# for an analysis that has nothing to analyse. If this workflow is ever added
# to branch protection as a required check, drop the filter first — a required
# check that is skipped by a path filter leaves pull requests waiting forever.
on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to publish the SARIF results to the Security tab.
      security-events: write
      # Lets CodeQL read workflow run metadata on private repositories.
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # build-mode: none — JavaScript/TypeScript is analysed straight from
      # source, so there is no `pnpm install` and no build step to pay for.
      # Adding one would only slow the job down without widening coverage.
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:javascript-typescript
