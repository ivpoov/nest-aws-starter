name: Bug report
description: Something in the starter behaves differently than documented or expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Only the first two fields
        are required — fill in as much of the rest as you can, but do not let a
        blank field stop you from reporting.

        **Found a security vulnerability?** Do not open an issue. Follow
        [SECURITY.md](https://github.com/ivpoov/nest-aws-starter/blob/main/SECURITY.md)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour you observed.
      placeholder: The API returned 500 when ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: >-
        The smallest sequence that triggers the problem, starting from a fresh
        clone if you can.
      placeholder: |
        1. `docker compose up -d --wait`
        2. `pnpm --dir apps/api run db:migrate`
        3. `pnpm --dir apps/api run start:dev`
        4. POST /auth/login with ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15.3 / Windows 11 + WSL2"
    validations:
      required: false

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v24.4.0
    validations:
      required: false

  - type: input
    id: pnpm-version
    attributes:
      label: pnpm version
      description: Output of `pnpm --version`.
      placeholder: 11.9.0
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Starter version or commit
      description: The release tag or commit SHA you are on.
      placeholder: v0.5.0 or 0f7b933
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - API (apps/api)
        - Web app (apps/web)
        - Admin panel (apps/admin)
        - Shared contracts (packages/shared)
        - Local infrastructure (docker compose, LocalStack, MinIO)
        - Build, CI or tooling
        - Documentation
        - Not sure
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: >-
        Paste the failing output. This is rendered as a code block, so no
        backticks are needed. Please redact secrets and tokens.
      render: shell
    validations:
      required: false
