# OSV-Scanner configuration, consumed by the `dependency-scan` job in
# .github/workflows/security.yml.
#
# osv-scanner reads the whole pnpm lockfile and cannot tell a runtime
# dependency from a build-time one, so it also reports advisories in packages
# that only ever exist on a developer's laptop or on the CI runner. The other
# dependency gate, `pnpm audit --prod --audit-level high` in ci.yml, filters to
# production dependencies instead — between them the production tree is
# covered twice, from two different advisory databases.
#
# POLICY for entries below:
#   * Only transitive, build-or-development-time packages that are never
#     installed into a deployed artifact are eligible.
#   * Every entry records why the package is not reachable in production and
#     which direct dependency pulls it in.
#   * Every entry carries `ignoreUntil`. These are NOT permanent exceptions —
#     the fix is an upstream release plus a lockfile bump, and the date is
#     there so the gate re-reports anything still unfixed instead of quietly
#     staying green forever.
#   * Anything reachable from production code is not eligible for this file.
#     Bump it, or do not ship.
#
# Reviewed 2026-08-09 against pnpm-lock.yaml; re-check on expiry.

# --- hono, @hono/node-server, valibot: pulled in by @prisma/dev -------------
# @prisma/dev is a devDependency of apps/api (the Prisma CLI's local dev
# server). It runs `prisma` commands on a workstation and in the migrate step
# in CI; none of it is bundled into or installed alongside the API runtime.
# Resolution: a @prisma/dev release that bumps its hono/valibot pins.

[[IgnoredVulns]]
id = "GHSA-92pp-h63x-v22m"
ignoreUntil = 2026-11-09
reason = "@hono/node-server 1.19.11, transitive via @prisma/dev (devDependency). No production code path imports hono."

