# OSV-Scanner configuration, consumed by the `dependency-scan` job in
# .github/workflows/security.yml.
#
# osv-scanner reads the whole pnpm lockfile and cannot tell a runtime
# dependency from a build-time one, so it also reports advisories in packages
# that only ever exist on a developer's laptop or on the CI runner. The other
# dependency gate, `pnpm audit --prod --audit-level high` in ci.yml, filters to
# production dependencies instead — between them the production tree is
# covered twice, from two different advisory databases.
#
# There are deliberately NO entries in this file. Every advisory it previously
# suppressed was fixed instead, by the pinned overrides in pnpm-workspace.yaml:
# nanoid, shell-quote, @prisma/dev (which carried hono, @hono/node-server and
# valibot) and hyperid (which carried uuid). The scan is clean on its own
# merits, with nothing filtered.
#
# POLICY, should an entry ever be needed again:
#   * Suppression is the last resort, not the first. If a fixed release
#     exists, take it — an override in pnpm-workspace.yaml reaches transitive
#     packages whose parent has not bumped yet, which covers almost every
#     case that looks unfixable at first glance.
#   * Only transitive, build-or-development-time packages that are never
#     installed into a deployed artifact are eligible.
#   * Every entry records why the package is not reachable in production and
#     which direct dependency pulls it in.
#   * Every entry carries `ignoreUntil`. These are NOT permanent exceptions —
#     the date is there so the gate re-reports anything still unfixed instead
#     of quietly staying green forever.
#   * Anything reachable from production code is not eligible for this file.
#     Bump it, or do not ship.
#   * Delete an entry the moment its advisory is actually fixed. A stale
#     suppression is worse than no suppression, because it silently swallows
#     the next advisory that happens to share the id.
#
# Reviewed 2026-08-09 against pnpm-lock.yaml: 0 findings, 0 suppressed.
