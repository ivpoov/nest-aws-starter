# --- nanoid: pulled in by postcss ------------------------------------------
# postcss is the build-time CSS pipeline behind the web and admin Vite builds.
# It runs during `pnpm run build` and is absent from the built bundles.
# Resolution: a postcss release pinning nanoid >= 3.3.17.

[[IgnoredVulns]]
id = "GHSA-2v37-7h3g-55p8"
ignoreUntil = 2026-11-09
reason = "nanoid 3.3.16, transitive via postcss (build-time only). Not present in any shipped bundle; the runtime never generates ids with it."

